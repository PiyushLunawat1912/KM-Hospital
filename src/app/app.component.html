<header id="header" class="header sticky-top">
  <div class="topbar">
    <div class="container">
      <div class="contact-info">
        <a href="mailto:kmmhospitalpimpri@gmail.com">
          <i class="fas fa-envelope"></i> kmmhospitalpimpri@gmail.com
        </a>
        <span class="contact-info">
          <a href="tel:8484069695"><i class="fas fa-phone"></i> 84840 69695</a>
        </span>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <div class="container">
      <!-- Logo & Site Name -->
      <div class="logo-container">
        <img src="assets/img/logo.jpg" alt="KM Hospital Logo" class="logo" />
        <h3 class="sitename">K.M.M HOSPITAL</h3>
      </div>

      <!-- Mobile Menu Toggle -->
      <div class="menu-toggle" (click)="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <!-- Menu -->
      <ul class="menu" [ngClass]="{ active: isMenuActive }">
        <li>
          <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()"
            >Home</a
          >
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"
            >About</a
          >
        </li>
        <li>
          <a
            routerLink="/gallery"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Gallery</a
          >
        </li>
        <li>
          <a
            routerLink="/services"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Services</a
          >
        </li>
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Contact</a
          >
        </li>

        <!-- Login & Logout Buttons -->
        <li *ngIf="!isLoggedIn"><button (click)="onLogin()">Login</button></li>
        <li *ngIf="isLoggedIn"><button (click)="onLogout()">Logout</button></li>
      </ul>

      <!-- Manage Appointments Button -->
      <!-- Manage Appointments Button (Only when logged in) -->
      <button
        *ngIf="isLoggedIn"
        (click)="manageAppointments()"
        class="manage-appointments-btn"
      >
        Manage Appointments
      </button>
      <!-- Call Button (Fixed Position) -->
      <button (click)="scrollToAppointment()" class="appointment-btn">
        Make an Appointment
      </button>
      <a href="tel:84840 69695" class="btn-quick-callcta">
        <span class="call-txt">Call Us Now</span>
        <span class="call-num">84840 69695</span>
      </a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <div class="hero-card">
        <h1>WELCOME TO KMM Hospital</h1>
        <h2><p>"Committed to Care, Dedicated to You."</p></h2>
      </div>
    </div>
  </section>

  <!-- Router Outlet -->
  <router-outlet></router-outlet>

  <!-- Footer -->
  <app-footer></app-footer>
</header>
